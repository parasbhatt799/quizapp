
<!DOCTYPE html>

    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
      window.googletag = window.googletag || {cmd: []};
      googletag.cmd.push(function() {
        googletag.pubads().enableSingleRequest();
        googletag.pubads().collapseEmptyDivs();
        googletag.enableServices();

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ff-orange: #ff4d00;
            --ff-yellow: #ffcc00;
            --ff-dark: #0a0a0c;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--ff-dark); 
            color: #f8fafc; 
            overflow-x: hidden;
        }
        .font-gaming { font-family: 'Orbitron', sans-serif; }
        .glass-effect { 
            background: rgba(22, 22, 26, 0.85); 
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 77, 0, 0.15); 
        }
        .ff-gradient { background: linear-gradient(135deg, #ff4d00 0%, #ffcc00 100%); }
        
        @keyframes marquee {
            0% { transform: translateX(50%); }
            100% { transform: translateX(-150%); }
        }
        .animate-marquee {
            animation: marquee 35s linear infinite;
        }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 0, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(255, 77, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 0, 0); }
        }
        .animate-pulse-ff { animation: pulse-orange 2s infinite; }

        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in { animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 100;
            animation: confetti-fall 3s linear forwards;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #ff4d00; border-radius: 10px; }
    </style>
